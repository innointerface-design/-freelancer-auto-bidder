name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[web,dev]'
      - run: ruff check .
      - run: pytest -q

  bidpilot:
    name: BidPilot v4.4 checks (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BidPilot_AI_Team_Cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: node --check app/static/app.js
      - run: node --check app/static/live.js
      - run: node --check app/static/support.js
      - run: node --check app/static/security.js
      - run: python -m pytest -q
